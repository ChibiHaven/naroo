name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MVP/package-lock.json

      - name: Install
        working-directory: MVP
        run: npm ci

      - name: Build
        working-directory: MVP
        env:
          VITE_N8N_WEBHOOK_URL: https://chibihaven.app.n8n.cloud/webhook/naroo-guidance
        run: npm run build

      - name: Add .nojekyll
        run: echo > MVP/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MVP/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
